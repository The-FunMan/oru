# Gradle JVM settings
org.gradle.jvmargs=-Xms1024m -Xmx4096m -Dfile.encoding=UTF-8
# AndroidX
android.useAndroidX=true
# Kotlin code style
kotlin.code.style=official
# AGP 9
android.builtInKotlin=true
# Performance & caching
org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.configuration-cache.parallel=true
org.gradle.parallel=true
org.gradle.tooling.parallel=true
# Repository downloads: more attempts, a longer wait and a pause between tries, so a slow or briefly unavailable host
# does not fail the build.
systemProp.org.gradle.internal.repository.max.tentatives=5
systemProp.org.gradle.internal.repository.initial.backoff=1000
systemProp.org.gradle.internal.http.connectionTimeout=60000
systemProp.org.gradle.internal.http.socketTimeout=60000
