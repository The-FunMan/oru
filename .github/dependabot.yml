version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: daily
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: gradle
    directories:
      - /
      - /patcher
    target-branch: dev
    schedule:
      interval: daily   # verification-metadata must be regenerated in the same PR when dependencies change
    groups:
      gradle:
        patterns: ["*"]
  - package-ecosystem: cargo
    directories:
      - /native
      - /native-packager
    target-branch: dev
    schedule:
      interval: daily
    groups:
      cargo:
        patterns: ["*"]
