name: Feature request
description: Propose a change or a new capability.
title: 'feat: '
labels: ['feature request']
body:
  - type: markdown
    attributes:
      value: |
        Oru prefers sensible defaults over settings. Search the [existing issues](https://github.com/The-FunMan/oru/issues?q=is%3Aissue)
        first. For a feature, open the issue and agree on it before you write code.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What Oru should do. Describe the behaviour, not the code.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other ways to solve the problem, and why you do not prefer them.
  - type: dropdown
    id: setting
    attributes:
      label: Does this add a setting?
      options:
        - "No"
        - "Yes"
    validations:
      required: true
  - type: textarea
    id: setting-reason
    attributes:
      label: Why a default cannot work
      description: Only if the answer above is Yes. Explain why one behaviour cannot fit every user.
  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Checklist
      options:
        - label: I searched the existing issues and this is not a duplicate.
          required: true
