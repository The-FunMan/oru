name: Bug report
description: Report a bug in Oru.
title: 'bug: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Before you report a bug, search the [existing issues](https://github.com/The-FunMan/oru/issues?q=is%3Aissue)
        for the same problem. Do not post a bug in the bundle of a patch here: report it to that bundle.
  - type: input
    id: oru-version
    attributes:
      label: Oru version and flavor
      description: Settings > About shows the version. The flavor is Oru unless you built it yourself.
      placeholder: 1.0.0 (Oru)
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Android version and device
      description: Manufacturer and model only, for example "Android 14, Pixel 8".
    validations:
      required: true
  - type: dropdown
    id: installer
    attributes:
      label: Installer used
      options:
        - System installer
        - Shizuku
        - Other (describe below)
    validations:
      required: true
  - type: input
    id: shizuku
    attributes:
      label: Shizuku version
      description: Only if you used Shizuku.
  - type: input
    id: patch-source
    attributes:
      label: Patch source
      description: "Default patches, or the URL of a public repository. Do not give a private URL."
  - type: input
    id: target
    attributes:
      label: Target app package and version
      description: The package name (for example com.example.app) and the version of the app. No file paths.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you did, in order.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What happened. Add screenshots if they help. Remove personal data from screenshots.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Debug log
      description: |
        Export the debug log from Settings > Advanced and attach it as a file. Before you attach it, open it and remove
        anything personal: account names, your user name in file paths, and the list of installed apps if you do not
        want that public. Do not attach a settings export or a keystore file. A settings export can contain signing
        material.
  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Checklist
      options:
        - label: I searched the existing issues and this is not a duplicate.
          required: true
        - label: This is not a failure of one patch in a patch bundle, or I have also reported it to that bundle.
          required: true
        - label: The attachments contain no personal data and no signing material.
          required: true
