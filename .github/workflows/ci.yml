name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  packages: read   # the Morphe library comes from GitHub Packages, which wants a token even for public reads

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-oru
      - name: Unit tests and lint
        run: ./gradlew :app:testOruDebugUnitTest :app:lint --stacktrace
      - name: Oru release APK, debug-signed, no secrets
        run: ./gradlew :app:assembleOruRelease -PsignAsDebug --stacktrace
      - name: Check the APK
        run: .github/scripts/verify-apk.sh app/build/outputs/apk/oru/release/*.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oru-pr-${{ github.sha }}
          path: app/build/outputs/apk/oru/release/*.apk
          retention-days: 5
          if-no-files-found: error

  patcher:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-oru
        with:
          native: false
      # Run from the patcher's own build. From the repository root Gradle also configures the app, whose Android
      # plugin then wants the NDK, which this job does not install.
      - run: cd patcher && ./gradlew test apiCheck jar --stacktrace

  patch-api-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-oru
        with:
          native: false
      - run: cd patcher && ./gradlew jar --stacktrace
      # The blocking check runs against a bundle pinned by tag and checksum (tools/parity/pinned-bundle.env), so a run
      # means the same thing every time. Newer upstream releases are checked in the advisory step below.
      - name: Fetch the pinned bundle
        run: |
          bundle=$(.github/scripts/fetch-pinned-bundle.sh "$RUNNER_TEMP/bundles/pinned" | tail -n 1)
          echo "BUNDLE=$bundle" >> "$GITHUB_ENV"
      - name: Guard, pinned bundle (blocking)
        run: |
          python3 -I tools/parity/patch_api_guard.py \
            --patcher "$(ls patcher/build/libs/morphe-patcher-[0-9]*.jar | head -1)" \
            --bundle "$BUNDLE"
      - name: Guard, newest upstream releases (advisory)
        continue-on-error: true
        run: |
          d="$RUNNER_TEMP/bundles/latest"
          mkdir -p "$d/stable" "$d/dev"
          .github/scripts/retry.sh 4 gh release download --repo MorpheApp/morphe-patches --pattern '*.mpp' --dir "$d/stable"
          tag=$(.github/scripts/retry.sh 4 gh release list --repo MorpheApp/morphe-patches --exclude-drafts --limit 30 \
                --json tagName,isPrerelease --jq '[.[] | select(.isPrerelease)][0].tagName')
          .github/scripts/retry.sh 4 gh release download "$tag" --repo MorpheApp/morphe-patches --pattern '*.mpp' --dir "$d/dev"
          status=0
          for set in stable dev; do
            python3 -I tools/parity/patch_api_guard.py \
              --patcher "$(ls patcher/build/libs/morphe-patcher-[0-9]*.jar | head -1)" \
              --bundle "$d/$set"/*.mpp || status=1
          done
          exit "$status"

  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A script committed from Windows loses its executable bit and then fails with "Permission denied" in CI.
      # The scripts shipped as app assets are not run from the repository, so they are left out.
      - name: Scripts are executable
        run: |
          bad=$(git ls-files -s '*.sh' | awk '$1 != "100755" && $4 !~ /\/assets\// {print $4}')
          if [ -n "$bad" ]; then
            echo "::error::These scripts are not executable in git. Run: git update-index --chmod=+x <file>"
            echo "$bad"
            exit 1
          fi
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            native-packager -> target
            native -> target
      - run: cd native-packager && cargo test --workspace --locked
      - run: cd native && cargo test --locked
      - run: python3 -I -m unittest discover -s tools/parity -p "test_*.py"

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
