name: Stable release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing vX.Y.Z tag on main'
        required: true
        type: string

permissions:
  contents: read
  packages: read   # the Morphe library comes from GitHub Packages, which wants a token even for public reads

concurrency:
  group: release-stable
  cancel-in-progress: false

jobs:
  gate:
    if: github.repository == 'The-FunMan/oru'
    uses: ./.github/workflows/ci.yml

  build:
    if: github.repository == 'The-FunMan/oru'
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    environment: release   # owner approval happens before any secret is released
    env:
      GITHUB_TOKEN: ${{ github.token }}
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - id: check               # tag form, on origin/main, equals the committed version, no -dev; writes notes
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: .github/scripts/check-stable-tag.sh
      - uses: ./.github/actions/setup-oru
      - name: Decode signing key (removed at the end)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: (umask 077; printf '%s' "$KEYSTORE_B64" | base64 -d > app/keystore.jks)
      - name: Build, verify and name the release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ENTRY_ALIAS: ${{ secrets.KEYSTORE_ENTRY_ALIAS }}
          KEYSTORE_ENTRY_PASSWORD: ${{ secrets.KEYSTORE_ENTRY_PASSWORD }}
          ORU_RELEASE_CERT_SHA256: ${{ vars.ORU_RELEASE_CERT_SHA256 }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          ./gradlew :app:assembleOruRelease --stacktrace
          .github/scripts/verify-apk.sh --release app/build/outputs/apk/oru/release/*.apk
          cp app/build/outputs/apk/oru/release/*.apk "dist/oru-${VERSION}.apk"
          (cd dist && sha256sum "oru-${VERSION}.apk" > SHA256SUMS.txt)
      - name: Remove signing key
        if: always()
        run: rm -f app/keystore.jks
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 5
          if-no-files-found: error

  publish:
    if: github.repository == 'The-FunMan/oru'
    needs: build
    runs-on: ubuntu-24.04
    permissions:              # write scopes only here, after the build; no secrets
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/oru-*.apk'
      - name: Publish as latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          gh release create "$TAG" dist/oru-*.apk dist/SHA256SUMS.txt \
            --verify-tag --latest --title "Oru ${TAG#v}" --notes-file dist/RELEASE_NOTES.md
